  <meta property="twitter:description" content="Mathematical Spatial Solvers, NBC 2016 Life Safety Proofs, and 25/50/25 Milestone Escrow.">

  <!-- Theme & iOS -->
  <meta name="theme-color" content="#070709">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Eventology">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Eventology | The Deterministic Event Production Platform</title>
  <link rel="manifest" href="manifest.json">

  <!-- Clean Obsidian Preload Styles -->
  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: #070709;
      color: #FFFFFF;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      overflow: hidden;
    }

    #loading-container {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      background: radial-gradient(circle at center, #141824 0%, #070709 100%);
      z-index: 99999;
      transition: opacity 0.5s ease-out;
    }

    .brand-mark {
      width: 56px;
      height: 56px;
      border-radius: 16px;
      background: linear-gradient(135deg, #FFD700 0%, #B8860B 100%);
      display: flex;
      justify-content: center;
      align-items: center;
      box-shadow: 0 0 30px rgba(255, 215, 0, 0.35);
      margin-bottom: 24px;
      animation: pulse 2s infinite ease-in-out;
    }

    .brand-mark svg {
      width: 32px;
      height: 32px;
      fill: #000000;
    }

    .brand-title {
      font-size: 20px;
      font-weight: 900;
      letter-spacing: 4px;
      color: #FFFFFF;
      margin-bottom: 8px;
    }

    .brand-tagline {
      font-size: 11px;
      letter-spacing: 1.5px;
      color: #9CA3AF;
      text-transform: uppercase;
      font-weight: 600;
      margin-bottom: 32px;
    }

    .progress-bar-track {
      width: 180px;
      height: 3px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 4px;
      overflow: hidden;
      position: relative;
    }

    .progress-bar-indicator {
      width: 100%;
      height: 100%;
      background: linear-gradient(90deg, #FFD700, #10B981);
      position: absolute;
      transform: translateX(-100%);
      animation: loading 1.8s infinite ease-in-out;
    }

    @keyframes loading {
      0% { transform: translateX(-100%); }
      50% { transform: translateX(0%); }
      100% { transform: translateX(100%); }
    }

    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.05); box-shadow: 0 0 45px rgba(255, 215, 0, 0.5); }
    }
  </style>
</head>
<body>
  <!-- Elegant Preloader -->
  <div id="loading-container">
    <div class="brand-mark">
      <svg viewBox="0 0 24 24">
        <path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-7 3c1.93 0 3.5 1.57 3.5 3.5S13.93 13 12 13s-3.5-1.57-3.5-3.5S10.07 6 12 6zm7 13H5v-.23c0-.62.28-1.2.76-1.58C7.47 15.82 9.64 15 12 15s4.53.82 6.24 2.19c.48.38.76.97.76 1.58V19z"/>
      </svg>
    </div>
    <div class="brand-title">EVENTOLOGY</div>
    <div class="brand-tagline">Deterministic Production Engine</div>
    <div class="progress-bar-track">
      <div class="progress-bar-indicator"></div>
    </div>
  </div>

  <script>
    // Remove preloader once Flutter is initialized
    window.addEventListener('flutter-first-frame', function () {
      var loader = document.getElementById('loading-container');
      if (loader) {
        loader.style.opacity = '0';
        setTimeout(function() {
          loader.remove();
        }, 500);
      }
    });
  </script>

  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
